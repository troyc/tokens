[package]
name = "tokens"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Count LLM tokens in a directory tree"
license = "MIT"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
fancy-regex = "0.14"
flate2 = "1.0"
ignore = "0.4"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
syn = { version = "2.0", default-features = false, features = ["full", "parsing", "printing", "visit"] }

[dev-dependencies]
sha2 = "0.10"
tempfile = "3.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"